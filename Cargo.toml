[package]
name = "copilot-powerline"
version = "0.2.0"
edition = "2024"
description = "A fast, customizable powerline status line for GitHub Copilot CLI"
license = "MIT"
repository = "https://github.com/xpepper/copilot-powerline"
readme = "README.md"
keywords = ["copilot", "github-copilot", "statusline", "powerline", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
