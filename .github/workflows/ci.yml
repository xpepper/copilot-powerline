name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # release.sh pushes a tag that cannot be undone, so lint it before it runs.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint shell scripts
        run: shellcheck scripts/* tests/*.sh

      - name: Check for machine-specific paths
        run: bash scripts/check-machine-paths

      - name: Test machine-path check
        run: bash tests/test-check-machine-paths.sh

      - name: Test fetch-github-copilot-usage
        run: bash tests/test-fetch-github-copilot-usage.sh

      - name: Test release script
        run: bash tests/test-release.sh

  # The release workflow publishes to crates.io, and a crates.io version
  # cannot be re-uploaded, so catch packaging problems before tagging.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Dry-run cargo publish
        run: cargo publish --dry-run

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

  # Flags changed code that tests run but don't check. Advisory: it is not a
  # required check, so surviving mutants show up in review without blocking.
  mutants:
    name: Mutants
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest

      - name: Diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff

      - name: Run cargo-mutants on the diff
        run: cargo mutants --in-diff pr.diff --test-tool nextest --no-shuffle -j 2

      # A diff with no mutable Rust code writes no mutants.out.
      - name: Summarize surviving mutants
        if: always()
        run: |
          if [ -s mutants.out/missed.txt ]; then
            {
              echo '### Surviving mutants'
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore
